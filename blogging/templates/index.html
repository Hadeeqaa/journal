{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>digital journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Jua", sans-serif;
      background-color: #fff5f0;
      background-image: url("{% static 'wallpaper.webp' %}");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      color: #d06fa0;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-card {
      background-image: url("{% static 'form.webp' %}");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      border: none;
      padding: 2.5rem 2rem;
      margin-bottom: 2rem;
    }

    .form-card input[type="text"],
    .form-card textarea {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-family: "Jua", sans-serif;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.7);
      color: #444;
      outline: none;
      border: 1.5px solid #f8c8dc;
      border-radius: 8px 3px 10px 4px / 4px 10px 3px 8px;
    }

    .form-card textarea {
      height: 120px;
      resize: vertical;
    }

    .btn-post {
      background: #f0a0c0;
      color: white;
      border: none;
      padding: 9px 22px;
      font-family: "Jua", sans-serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 20px;
    }

    .btn-post:hover {
      background: #d06fa0;
    }

    .feed-label {
      font-size: 13px;
      color: #c090b0;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .post-card {
      background: rgba(255, 253, 249, 0.9);
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1.5px solid #f8d4e4;
      border-radius: 10px 4px 14px 6px / 6px 14px 4px 10px;
    }

    .post-title {
      font-size: 17px;
      font-weight: 600;
      color: #c06090;
      margin-bottom: 4px;
    }

    .post-meta {
      font-size: 12px;
      color: #c8a0b8;
      margin-bottom: 8px;
    }

    .post-body {
      font-size: 15px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .post-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      border: 1.5px solid #f0c0d4;
      background: transparent;
      color: #c060a0;
    }

    .btn-sm:hover {
      background: #fff0f6;
    }

    .btn-delete {
      border-color: #f8c0c0;
      color: #d04040;
    }

    .btn-delete:hover {
      background: #fff5f5;
    }

    .empty {
      text-align: center;
      color: #d0a0b8;
      font-size: 15px;
      padding: 3rem 0;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>share a message ♡</h1>

    <div class="form-card">
      <form method="POST" action="{% url 'post_creation' %}">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Title..." />
        <textarea name="content" placeholder="Write something..."></textarea>
        <button type="submit" class="btn-post">Post ♡</button>
      </form>
    </div>

    <div class="feed-label">entries</div>

    {% for post in posts %}
    <div class="post-card">
      <div class="post-title">{{ post.title }}</div>
      <div class="post-meta">{{ post.created_at }}</div>
      <div class="post-body">{{ post.content }}</div>
      <div class="post-actions">
        <a href="{% url 'post_edit' post.pk %}">
          <button class="btn-sm">Edit</button>
        </a>
        <form method="POST" action="{% url 'post_delete' post.pk %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn-delete btn-sm">Delete</button>
        </form>
      </div>
    </div>
    {% empty %}
    <div class="empty">havent shared your thoughts yet :3 ?!</div>
    {% endfor %}

  </div>
</body>

</html>
